<!doctype html><html><head><title>CyberNet 97</title><link rel="stylesheet" href="{{url_for('static',filename='retro.css')}}"></head><body><div class="page"><div class="titlebar">CyberSearch 97</div><h1>CYBERSEARCH</h1><div class="box center"><form><input name="q" value="{{q}}" size="45"><input type="submit" value="Search!"></form></div><div class="box">{% if q %}<h2>Results for "{{q}}"</h2>{% for r in results %}<p><b><a href="{{r[1]}}">{{r[0]}}</a></b><br>{{r[2]}}</p><hr>{% else %}<p>No results found.</p>{% endfor %}{% else %}<p>Try games, music, aliens, computers, or homepage.</p>{% endif %}</div></div></body></html>
